ludus:
  - vm_name: "{{ range_id }}-elastic"
    hostname: "{{ range_id }}-rivendell"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 20
    ram_gb: 8
    cpus: 4
    linux: true
    roles:
      - badsectorlabs.ludus_elastic_container
    role_vars:
      ludus_elastic_password: "thisisapassword"

  - vm_name: "{{ range_id }}-dc"
    hostname: "{{ range_id }}-minas-tirith"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 8
    cpus: 2
    windows:
      sysprep: false
    domain:
      fqdn: gondor.local
      role: primary-dc
    roles:
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-member"
    hostname: "{{ range_id }}-dol-amroth"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 12
    ram_gb: 8
    cpus: 4
    windows:
      install_additional_tools: true
      chocolatey_ignore_checksums: true
      office_version: 2019
      office_arch: 64bit
    domain:
      fqdn: gondor.local
      role: member
    roles:
      - badsectorlabs.ludus_elastic_agent

network:
  inter_vlan_default: REJECT
  rules:
    - name: gondor intra-VLAN allow all
      vlan_src: 10
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT